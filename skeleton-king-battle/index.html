<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骸骨王 vs 魔法兵士 — 氷原の30秒</title>
<style>
  :root { --bg: #07090e; --fg: #dfe6ee; --dim: #7d8794; --a: #ff7a1a; --b: #d9c8ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 10px; letter-spacing: .04em; }
  h1 span.a { color: var(--a); } h1 span.b { color: var(--b); }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #000; border-radius: 4px; }
  .bar { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  button, select { background: #151a23; color: var(--fg); border: 1px solid #2a3240; border-radius: 4px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--b); }
  #play { width: 44px; }
  #time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 150px; }
  #section { color: var(--b); }
  .track { position: relative; flex: 1 1 100%; height: 40px; }
  #scrub { width: 100%; accent-color: var(--a); margin: 0; }
  #marks { position: relative; height: 18px; }
  #marks button { position: absolute; transform: translateX(-50%); padding: 0 4px; font-size: 11px; border: none; background: none; color: var(--dim); }
  #marks button:hover { color: var(--b); }
  label { color: var(--dim); display: flex; gap: 4px; align-items: center; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
  #wrap:fullscreen { max-width: none; background: #000; display: flex; flex-direction: column; justify-content: center; }
</style>
</head>
<body>
<div id="wrap">
  <h1><span class="a">骸骨王</span> vs <span class="b">魔法兵士</span> — 凍結氷原・30秒シームレスカット</h1>
  <canvas id="stage" width="1280" height="720"></canvas>
  <div class="bar">
    <button id="play" title="再生/一時停止 (Space)">▶</button>
    <span id="time">0:00:00 / 0:30:00</span>
    <span id="section"></span>
    <span style="flex:1"></span>
    <label>速度 <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option><option value="0.1">0.1×</option></select></label>
    <label><input type="checkbox" id="loop" checked> ループ</label>
    <button id="fs" title="フルスクリーン">⛶</button>
    <div class="track">
      <input id="scrub" type="range" min="0" max="30" step="0.001" value="0">
      <div id="marks"></div>
    </div>
  </div>
  <div class="hint">Space 再生/停止 ・ ←/→ 1コマ送り (Shift で1秒) ・ URL に <code>?t=14.4</code> で任意フレームから停止表示</div>
</div>
<script src="js/core.js"></script>
<script src="js/king.js"></script>
<script src="js/timeline.js"></script>
<script src="js/world.js"></script>
<script src="js/soldier.js"></script>
<script src="js/fx.js"></script>
<script src="js/hero.js"></script>
<script src="js/render.js"></script>
</body>
</html>
